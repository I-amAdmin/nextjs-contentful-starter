<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YofiPlus Banner Preview</title>
<style>body{margin:0;background:#fff;font-family:Heebo,Arial,sans-serif}</style></head><body>
<!-- ===== YofiPlus hero banner – paste into a Flatsome "HTML" element / UX Block ===== -->
<style>
.yp-hero{--yp-bg1:#fbf5ef;--yp-bg2:#f2e1d6;--yp-gold:#c8a27c;--yp-rose:#e9c9bb;
  position:relative;overflow:hidden;direction:rtl;isolation:isolate;
  display:grid;grid-template-columns:42% 58%;align-items:center;
  min-height:560px;padding:0 4%;
  background:
    radial-gradient(60% 80% at 22% 55%,#fffaf5 0%,rgba(255,250,245,0) 70%),
    radial-gradient(45% 60% at 95% 10%,rgba(233,201,187,.55) 0%,rgba(233,201,187,0) 70%),
    linear-gradient(120deg,var(--yp-bg2) 0%,var(--yp-bg1) 55%,#f6ebe3 100%);
  font-family:inherit}
.yp-hero *{box-sizing:border-box}

/* decorative silk strands */
.yp-hero__silk{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.yp-hero__silk path{fill:none;stroke:var(--yp-gold);stroke-linecap:round}

/* text area – intentionally empty, reserved for your headline / button */
.yp-hero__content{position:relative;z-index:3;padding:48px 0;min-height:200px;
  display:flex;flex-direction:column;justify-content:center;gap:16px}

/* product stage */
.yp-hero__stage{position:relative;width:100%;aspect-ratio:10/7.4;max-width:820px;margin-inline:auto}
.yp-hero__halo{position:absolute;left:8%;right:8%;top:4%;bottom:12%;border-radius:50%;
  background:radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.75) 45%,rgba(255,255,255,0) 100%)}
.yp-hero__ring{position:absolute;left:24%;right:24%;top:0;bottom:46%;border-radius:50%;
  border:1px solid rgba(200,162,124,.45)}
.yp-hero__podium{position:absolute;border-radius:50%;
  background:radial-gradient(closest-side,#fffdfb 0%,#f3e4da 70%,rgba(226,198,182,0) 100%);
  box-shadow:0 18px 40px -18px rgba(120,80,60,.35)}
.yp-hero__podium--back{left:6%;right:6%;bottom:30%;height:13%}
.yp-hero__podium--front{left:-2%;right:-2%;bottom:0;height:17%}

.yp-p{position:absolute;margin:0;aspect-ratio:1/1;
  mix-blend-mode:multiply; /* melts white product-photo backgrounds into the banner */
  animation:yp-rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.yp-p img{display:block;width:100%;height:100%;object-fit:contain;
  transition:transform .5s ease}
.yp-p a{display:block;width:100%;height:100%}
.yp-p:hover img{transform:translateY(-6px) scale(1.03)}
.yp-p--hero{z-index:6}
.yp-hero__glow{position:absolute;left:36%;width:28%;bottom:8%;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,226,196,.9),rgba(255,226,196,0))}

/* sparkles */
.yp-spark{position:absolute;width:10px;height:10px;z-index:7;pointer-events:none;
  background:radial-gradient(circle,#fff 0 30%,rgba(255,255,255,0) 70%);
  animation:yp-twinkle 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.yp-spark::before,.yp-spark::after{content:"";position:absolute;left:50%;top:50%;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
  transform:translate(-50%,-50%)}
.yp-spark::before{width:26px;height:1.5px}
.yp-spark::after{width:1.5px;height:26px;background:linear-gradient(0deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0))}

@keyframes yp-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes yp-twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.yp-p,.yp-spark{animation:none}.yp-p img{transition:none}}

/* tablet */
@media (max-width:1024px){.yp-hero{grid-template-columns:40% 60%;min-height:460px}}

/* mobile: text space on top, products below */
@media (max-width:767px){
  .yp-hero{grid-template-columns:1fr;min-height:0;padding:0 16px 8px}
  .yp-hero__content{padding:36px 4px 8px;min-height:190px;text-align:center;align-items:center}
  .yp-hero__stage{aspect-ratio:10/8.2;max-width:520px}
}
</style>

    <figure class="yp-p" style="width:25%;left:-1%;bottom:4%;z-index:4;--d:.36s">

    </figure>
    <figure class="yp-p yp-p--hero" style="width:31%;left:34.5%;bottom:5%;--d:.5s">

    </figure>
    <figure class="yp-p" style="width:25%;left:58%;bottom:6%;z-index:5;--d:.56s">

    </figure>
    <figure class="yp-p" style="width:25%;left:76%;bottom:4%;z-index:4;--d:.62s">
      <img src="https://www.yofiplus.co.il/files/catalog/item/source/4045787141382.jpg" alt="סרום לשיער Schwarzkopf Osis Magic Finish" loading="eager">
    </figure>

    <span class="yp-spark" style="left:48%;top:22%;--d:.2s"></span>
    <span class="yp-spark" style="left:27%;top:40%;--d:1.1s"></span>
    <span class="yp-spark" style="left:72%;top:30%;--d:2s"></span>
    <span class="yp-spark" style="left:60%;top:70%;--d:1.6s"></span>
  </div>
</section>
